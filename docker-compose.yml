services:
  backend:
    build: ./engine
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      # Para que --reload detecte cambios en volumenes montados desde Windows.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./engine:/app

  frontend:
    build: ./frontend
    ports:
      - "5175:5173"
    environment:
      BACKEND_URL: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      # los ejemplos se importan de ../machines (vite fs.allow "..")
      - ./machines:/machines:ro
      - /app/node_modules
    depends_on:
      - backend
