# a^n b^n c^n (n >= 1). El cache guarda el simbolo que se busca marcar (b o c).
q_states:
  q_list: ['0', '1', '2', '3', '4']
  initial: '0'
  final: '4'
alphabet: [a, b, c]
tape_alphabet: ['-', a, b, c, X, Y, Z]
delta:
  - params: {initial_state: '0', mem_cache_value: '', tape_input: 'a'}
    output: {final_state: '1', mem_cache_value: 'b', tape_output: 'X', tape_displacement: R}
  - params: {initial_state: '0', mem_cache_value: '', tape_input: 'Y'}
    output: {final_state: '3', mem_cache_value: '', tape_output: 'Y', tape_displacement: R}
  - params: {initial_state: '1', mem_cache_value: 'b', tape_input: 'a'}
    output: {final_state: '1', mem_cache_value: 'b', tape_output: 'a', tape_displacement: R}
  - params: {initial_state: '1', mem_cache_value: 'b', tape_input: 'Y'}
    output: {final_state: '1', mem_cache_value: 'b', tape_output: 'Y', tape_displacement: R}
  - params: {initial_state: '1', mem_cache_value: 'b', tape_input: 'b'}
    output: {final_state: '1', mem_cache_value: 'c', tape_output: 'Y', tape_displacement: R}
  - params: {initial_state: '1', mem_cache_value: 'c', tape_input: 'b'}
    output: {final_state: '1', mem_cache_value: 'c', tape_output: 'b', tape_displacement: R}
  - params: {initial_state: '1', mem_cache_value: 'c', tape_input: 'Z'}
    output: {final_state: '1', mem_cache_value: 'c', tape_output: 'Z', tape_displacement: R}
  - params: {initial_state: '1', mem_cache_value: 'c', tape_input: 'c'}
    output: {final_state: '2', mem_cache_value: '', tape_output: 'Z', tape_displacement: L}
  - params: {initial_state: '2', mem_cache_value: '', tape_input: 'a'}
    output: {final_state: '2', mem_cache_value: '', tape_output: 'a', tape_displacement: L}
  - params: {initial_state: '2', mem_cache_value: '', tape_input: 'b'}
    output: {final_state: '2', mem_cache_value: '', tape_output: 'b', tape_displacement: L}
  - params: {initial_state: '2', mem_cache_value: '', tape_input: 'c'}
    output: {final_state: '2', mem_cache_value: '', tape_output: 'c', tape_displacement: L}
  - params: {initial_state: '2', mem_cache_value: '', tape_input: 'Y'}
    output: {final_state: '2', mem_cache_value: '', tape_output: 'Y', tape_displacement: L}
  - params: {initial_state: '2', mem_cache_value: '', tape_input: 'Z'}
    output: {final_state: '2', mem_cache_value: '', tape_output: 'Z', tape_displacement: L}
  - params: {initial_state: '2', mem_cache_value: '', tape_input: 'X'}
    output: {final_state: '0', mem_cache_value: '', tape_output: 'X', tape_displacement: R}
  - params: {initial_state: '3', mem_cache_value: '', tape_input: 'Y'}
    output: {final_state: '3', mem_cache_value: '', tape_output: 'Y', tape_displacement: R}
  - params: {initial_state: '3', mem_cache_value: '', tape_input: 'Z'}
    output: {final_state: '3', mem_cache_value: '', tape_output: 'Z', tape_displacement: R}
  - params: {initial_state: '3', mem_cache_value: '', tape_input: ''}
    output: {final_state: '4', mem_cache_value: '', tape_output: '', tape_displacement: S}
simulation_strings: [aabbcc, aaabbbccc, aabbbcc, aabcc]
